name: Go

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: go.sum
      - run: go version
      - run: go mod download
      - run: go mod verify
      - run: go build ./...
      - run: go test -count=1 -timeout=60s ./...

  quality:
    name: Race and quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: go.sum
      - run: go test -race -count=1 -timeout=60s ./...
      - run: go vet ./...
      - name: Smoke test the runnable policy service
        run: |
          go build -o /tmp/spfd ./cmd/spfd
          python3 tools/smoke_spfd.py /tmp/spfd
      - name: Validate the deployment with Unbound
        run: |
          sudo apt-get update
          sudo apt-get install -y unbound
          sudo install -m 0644 deploy/unbound/spfd.conf /etc/unbound/unbound.conf.d/spfd.conf
          sudo install -m 0644 deploy/unbound/smoke-test.conf.example /etc/unbound/unbound.conf.d/spfd-smoke-test.conf
          sudo unbound-checkconf
          sudo install -m 0755 /tmp/spfd /usr/local/bin/spfd
          sudo install -m 0644 deploy/spfd.env /etc/default/spfd
          sudo systemd-analyze verify deploy/spfd.service
          # Ubuntu's Unbound AppArmor profile permits this tree, not /tmp.
          sudo install -d -m 0700 -o "$(id -un)" -g "$(id -gn)" /var/lib/unbound/spfd-smoke
          TMPDIR=/var/lib/unbound/spfd-smoke python3 tools/smoke_spfd_unbound.py /tmp/spfd
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go mod tidy -diff

      - name: Check reachable dependency vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  fuzz:
    name: Bounded fuzz smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Exercise parser, macros, evaluation, and DNS names
        run: |
          for target in FuzzLexer FuzzParserSyntax FuzzMacroExpansion FuzzStep6Evaluation FuzzDNSLiteralNames; do
            go test -run '^$' -fuzz "^${target}$" -fuzztime=10s -parallel=2 -timeout=60s .
          done
