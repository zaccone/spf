name: DNS migration diagnostics

on:
  pull_request:
    paths:
      - 'tools/dnscompat/**'
      - '.github/workflows/dns-compatibility.yml'
  push:
    branches: [master]
    paths:
      - 'tools/dnscompat/**'
      - '.github/workflows/dns-compatibility.yml'
  workflow_dispatch:
    inputs:
      require-compatible:
        description: 'Run the strict release gate (currently fails on known label ambiguity)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostics:
    name: Diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: tools/dnscompat
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: tools/dnscompat/go.sum
      - run: go mod verify
      - name: Run diagnostics (BLOCKER logs are not release approval)
        run: go test -race -v -count=1 -timeout=60s ./...
      - run: go vet ./...
      - run: go mod tidy -diff
      - name: Require compatibility for release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['require-compatible'] }}
        run: go test -v -count=1 -timeout=60s -args -require-compatible
