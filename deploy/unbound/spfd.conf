# Debian/Ubuntu: /etc/unbound/unbound.conf.d/spfd.conf
# Use with the package's root trust anchor configuration; see deploy/README.md.
# This profile is for an Unbound instance dedicated to SPF on this host.
server:
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.1/32 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    do-udp: yes
    do-tcp: yes
    do-ip4: yes
    # IPv4 DNS transport still resolves AAAA records and IPv6 SPF clients.
    # Enable IPv6 transport if this host has working IPv6 Internet access.
    do-ip6: no

    module-config: "validator iterator"
    val-permissive-mode: no
    qname-minimisation: yes
    edns-buffer-size: 1232
    hide-identity: yes
    hide-version: yes

    num-threads: 1
    msg-cache-size: 32m
    rrset-cache-size: 64m
    prefetch: yes
    # Do not extend expired SPF authorization during a DNS outage.
    serve-expired: no
    cache-min-ttl: 0
    log-queries: no
    log-replies: no
