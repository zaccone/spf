# Local recursive cache for SPF lookups. Install this file as
# /etc/unbound/unbound.conf (or include it from the system configuration).

server:
	# Keep the resolver private to this host. spfd and ServerResolver can use
	# 127.0.0.1:53 without exposing an open recursive resolver.
	interface: 127.0.0.1
	port: 53
	access-control: 127.0.0.0/8 allow
	access-control: 0.0.0.0/0 refuse

	do-udp: yes
	do-tcp: yes
	prefetch: yes
	qname-minimisation: yes
	hide-identity: yes
	hide-version: yes
