server:
    interface: 127.0.0.1
    port: 53
    username: ""
    chroot: ""
    directory: "/var/lib/unbound/spf-bench-full"
    pidfile: "/var/lib/unbound/spf-bench-full/unbound.pid"
    use-syslog: no
    do-not-query-localhost: no
    access-control: 127.0.0.0/8 allow
    prefetch: no
    serve-expired: no
    rrset-roundrobin: no
    statistics-cumulative: yes
    extended-statistics: yes
    local-zone: "." refuse
remote-control:
    control-enable: yes
    control-interface: "/var/lib/unbound/spf-bench-full/control.sock"
    control-use-cert: no
server:
    local-zone: "spfbench.test." transparent
    domain-insecure: "spfbench.test."
stub-zone:
    name: "spfbench.test."
    stub-addr: 127.0.0.1@15353
    stub-first: no
server:
    local-zone: "2.0.192.in-addr.arpa." transparent
    domain-insecure: "2.0.192.in-addr.arpa."
stub-zone:
    name: "2.0.192.in-addr.arpa."
    stub-addr: 127.0.0.1@15353
    stub-first: no
server:
    local-zone: "8.b.d.0.1.0.0.2.ip6.arpa." transparent
    domain-insecure: "8.b.d.0.1.0.0.2.ip6.arpa."
stub-zone:
    name: "8.b.d.0.1.0.0.2.ip6.arpa."
    stub-addr: 127.0.0.1@15353
    stub-first: no
server:
    local-zone: "fault.spfbench.test." transparent
    domain-insecure: "fault.spfbench.test."
stub-zone:
    name: "fault.spfbench.test."
    stub-addr: 127.0.0.1@15354
    stub-first: no
