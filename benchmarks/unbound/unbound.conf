server:
    interface: 127.0.0.1
    interface: ::1
    num-threads: 4
    so-reuseport: yes
    msg-cache-size: 128m
    rrset-cache-size: 256m
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    ratelimit: 0
    ip-ratelimit: 0
    outgoing-range: 8192
    num-queries-per-thread: 4096
    so-rcvbuf: 4m
    so-sndbuf: 4m
    do-not-query-localhost: no
    domain-insecure: "benchmark.test."
    local-zone: "test." transparent
    prefetch: no
    serve-expired: no
    extended-statistics: yes
    statistics-cumulative: yes
forward-zone:
    name: "benchmark.test."
    forward-addr: 127.0.0.1@15353
remote-control:
    control-enable: yes
    control-interface: /run/unbound.ctl
